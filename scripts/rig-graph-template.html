<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig Graph</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  #chart { display: block; width: 100vw; height: 100vh; }
  .node-label { font-size: 11px; pointer-events: none;
                paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 3px; }
  .edge-label { font-size: 9px; fill: #888; pointer-events: none;
                paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 2.5px;
                opacity: 0; }
  .edge-label.lit, .edge-label.hover { opacity: 1; font-size: 12px; fill: #222; }
  .unresolved-edge { stroke-dasharray: 4 3; }
  .scoped-edge { stroke-dasharray: 2 3; }  /* loom-wide / wildcard subscription */
  #tooltip { position: absolute; display: none; max-width: 320px;
             padding: 8px 10px; font-size: 12px; line-height: 1.5;
             background: #fff; color: #222; border: 1px solid #bbb;
             border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
             pointer-events: none; }
  #legend { position: absolute; top: 10px; left: 10px; padding: 8px 10px;
            font-size: 11px; background: rgba(255,255,255,.9);
            border: 1px solid #ccc; border-radius: 6px; max-height: 90vh;
            overflow-y: auto; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend .row.loom-row { cursor: pointer; border-radius: 3px; }
  #legend .row.loom-row:hover { background: rgba(0,0,0,.06); }
  #legend .row.loom-row.active { background: rgba(0,0,0,.12); font-weight: 600; }
  #legend .row input { margin: 0; cursor: pointer; }
  #legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  #legend .hint { color: #999; margin-top: 6px; font-size: 10px; line-height: 1.4; }
  #title { position: absolute; top: 10px; right: 14px; font-size: 13px;
           color: #666; }
</style>
</head>
<body>
<svg id="chart"></svg>
<div id="tooltip"></div>
<div id="legend"></div>
<div id="title">rig graph</div>
<script>
/*__D3__*/
</script>
<script>
/*__GRAPH_JSON__*/
const svg = d3.select("#chart");
const W = () => window.innerWidth, H = () => window.innerHeight;
svg.attr("viewBox", [0, 0, W(), H()]);

const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 4])
      .on("zoom", (ev) => g.attr("transform", ev.transform)));

const defs = g.append("defs").append("marker")
  .attr("id", "arrow").attr("viewBox", "0 -5 10 10")
  .attr("refX", 22).attr("refY", 0)
  .attr("markerWidth", 6).attr("markerHeight", 6)
  .attr("orient", "auto");
defs.append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#999");

const looms = [...new Set(data.nodes.filter(n => n.kind === "knot").map(n => n.loom))];
const loomColor = d3.scaleOrdinal(looms, d3.schemeTableau10);
const kindColor = { input: "#aaa", system: "#e67e22", unresolved: "#c0392b" };
const color = (n) => n.kind === "knot" ? loomColor(n.loom) : kindColor[n.kind];

const nodes = data.nodes, links = data.edges;

// Parallel edges between the same node pair overlap as straight lines
// (a bidirectional pair draws as one line with an arrowhead at each end,
// and clicks hit whichever is topmost). Count them per unordered pair and
// spread each into its own perpendicular arc.
const pairCount = {};
links.forEach((e) => {
  const a = e.source, b = e.target;  // still string ids (pre-simulation)
  e._pair = a < b ? a + "\u0000" + b : b + "\u0000" + a;
  e._idx = pairCount[e._pair] || 0;
  pairCount[e._pair]++;
});
function arcGeom(d) {
  const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
  const n = pairCount[d._pair];
  if (n === 1) {  // lone edge: straight
    return { path: "M" + sx + "," + sy + "L" + tx + "," + ty,
             mx: (sx + tx) / 2, my: (sy + ty) / 2 };
  }
  const dx = tx - sx, dy = ty - sy;
  const len = Math.hypot(dx, dy) || 1;
  const off = (d._idx - (n - 1) / 2) * 46;  // perpendicular spread
  const cx = (sx + tx) / 2 - (dy / len) * off;
  const cy = (sy + ty) / 2 + (dx / len) * off;
  // Midpoint of the quadratic at t = 0.5 (label position).
  return { path: "M" + sx + "," + sy + "Q" + cx + "," + cy + " " + tx + "," + ty,
           mx: 0.25 * sx + 0.5 * cx + 0.25 * tx,
           my: 0.25 * sy + 0.5 * cy + 0.25 * ty };
}

const link = g.append("g").selectAll("path").data(links).join("path")
  .attr("fill", "none")
  .attr("stroke", (d) => d.unresolved ? "#c0392b" : "#999")
  .attr("stroke-opacity", 0.6)
  .attr("stroke-width", 1.5)
  .attr("class", (d) => "edge"
      + (d.unresolved ? " unresolved-edge" : "")
      + (d.scope ? " scoped-edge" : ""))
  .attr("marker-end", "url(#arrow)");

const linkLabel = g.append("g").selectAll("text").data(links).join("text")
  .attr("class", "edge-label").attr("text-anchor", "middle")
  .text((d) => d.label + (d.scope === "all" ? " · all" : ""));

// Wide invisible hit paths make thin edges clickable and hoverable.
const linkHit = g.append("g").selectAll("path").data(links).join("path")
  .attr("fill", "none")
  .attr("stroke", "transparent").attr("stroke-width", 10)
  .style("pointer-events", "stroke").style("cursor", "pointer")
  // Hover reveals the (otherwise hidden) label — identity-based lookup,
  // D3 v7 listeners take no index argument.
  .on("mouseover", (ev, d) =>
    linkLabel.filter((e) => e === d).classed("hover", true))
  .on("mouseout", (ev, d) =>
    linkLabel.filter((e) => e === d).classed("hover", false));

const node = g.append("g").selectAll("g").data(nodes).join("g")
  .style("cursor", "pointer");

node.filter((d) => d.kind === "knot").append("circle")
  .attr("r", 12).attr("fill", (d) => color(d)).attr("stroke", "#fff").attr("stroke-width", 2);
node.filter((d) => d.kind === "input").append("rect")
  .attr("x", -8).attr("y", -8).attr("width", 16).attr("height", 16)
  .attr("transform", "rotate(45)").attr("fill", (d) => color(d))
  .attr("stroke", "#fff").attr("stroke-width", 2);
node.filter((d) => d.kind === "system").append("circle")
  .attr("r", 16).attr("fill", (d) => color(d)).attr("stroke", "#fff").attr("stroke-width", 2);
node.filter((d) => d.kind === "unresolved").append("circle")
  .attr("r", 12).attr("fill", "none").attr("stroke", (d) => color(d))
  .attr("stroke-width", 2).attr("stroke-dasharray", "4 3");

node.append("text").attr("class", "node-label")
  .attr("dy", (d) => (d.kind === "system" ? 28 : 26)).attr("text-anchor", "middle")
  .text((d) => d.label);

// ---- Selection state -------------------------------------------------------
// Filtering (legend checkboxes) hides; highlighting (clicks) fades.
// They are independent and compose. Selections are matched by identity
// (D3 v7 event listeners receive (event, datum) — no index argument).
const hiddenLooms = new Set();
let activeLoom = null, activeNode = null, activeEdge = null;

const knotVisible = (d) => d.kind !== "knot" || !hiddenLooms.has(d.loom);
const edgeVisible = (d) => knotVisible(d.source) && knotVisible(d.target);

function clearSelection() {
  activeLoom = null; activeNode = null; activeEdge = null;
  highlight();
}

function highlight() {
  // Resolve the active selection into focused node ids + edge objects.
  let set = null;
  if (activeEdge !== null) {
    const e = activeEdge;
    set = { nodes: new Set([e.source.id, e.target.id]),
            edges: new Set([e]) };
  } else if (activeNode !== null) {
    const ns = new Set([activeNode]), es = new Set();
    links.forEach((e) => {
      if (e.source.id === activeNode || e.target.id === activeNode) {
        es.add(e); ns.add(e.source.id); ns.add(e.target.id);
      }
    });
    set = { nodes: ns, edges: es };
  } else if (activeLoom !== null) {
    // Target loom + every node feeding into it: for each edge pointing at
    // a loom knot, the edge's source (knot, input, or system) joins the
    // focused set — one hop upstream, no downstream, no further expansion.
    const loomIds = new Set(nodes.filter(
      (n) => n.kind === "knot" && n.loom === activeLoom).map((n) => n.id));
    const ns = new Set(loomIds), es = new Set();
    links.forEach((e) => {
      if (loomIds.has(e.source.id) || loomIds.has(e.target.id)) {
        es.add(e);
        if (loomIds.has(e.target.id)) ns.add(e.source.id); // feeding node
      }
    });
    set = { nodes: ns, edges: es };
  }
  node.style("opacity", (d) => !set || set.nodes.has(d.id) ? 1 : 0.15);
  link.style("opacity", (d) => !set ? 0.6 : (set.edges.has(d) ? 1 : 0.05));
  linkLabel.classed("lit", (d) => !!set && set.edges.has(d));
  legend.selectAll("div.loom-row").classed("active", (l) => l === activeLoom);
}

function visibility() {
  node.style("display", (d) => knotVisible(d) ? null : "none");
  link.style("display", (d) => edgeVisible(d) ? null : "none");
  linkLabel.style("display", (d) => edgeVisible(d) ? null : "none");
  linkHit.style("display", (d) => edgeVisible(d) ? null : "none");
  // Drop a node highlight that the filter just hid.
  if (activeNode !== null &&
      !knotVisible(nodes.find((n) => n.id === activeNode))) {
    activeNode = null;
  }
  highlight();
}

// Click handlers (stopPropagation keeps the background clear from firing).
node.on("click", (ev, d) => {
  ev.stopPropagation();
  activeNode = activeNode === d.id ? null : d.id;
  activeLoom = null; activeEdge = null;
  highlight();
});
linkHit.on("click", (ev, d) => {
  ev.stopPropagation();
  activeEdge = activeEdge === d ? null : d;
  activeNode = null; activeLoom = null;
  highlight();
});
svg.on("click.clear", clearSelection);

const tooltip = d3.select("#tooltip");
node.on("mouseover", (ev, d) => {
  const rows = [["kind", d.kind], ["loom", d.loom], ["profile", d.profile],
                ["status", d.status], ["last event", d.last_event_at],
                ["strand-dir", d.strand_dir]].filter(([, v]) => v);
  tooltip.style("display", "block").html(
    "<b>" + d.label + "</b><br>" + rows.map(([k, v]) => k + ": " + v).join("<br>"));
}).on("mousemove", (ev) => {
  tooltip.style("left", (ev.pageX + 14) + "px").style("top", (ev.pageY + 10) + "px");
}).on("mouseout", () => tooltip.style("display", "none"));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id((d) => d.id).distance(130).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-400))
  .force("center", d3.forceCenter(W() / 2, H() / 2))
  .force("collide", d3.forceCollide(34))
  .on("tick", () => {
    link.attr("d", (d) => arcGeom(d).path);
    linkHit.attr("d", (d) => arcGeom(d).path);
    linkLabel.attr("x", (d) => arcGeom(d).mx)
             .attr("y", (d) => arcGeom(d).my);
    node.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
  });

// ---- Legend: checkbox = filter the loom, name click = highlight it --------
const legend = d3.select("#legend");
const loomRows = legend.selectAll("div.loom-row").data(looms).enter()
  .append("div").attr("class", "row loom-row");
loomRows.append("input").attr("type", "checkbox")
  .property("checked", true)
  .on("change", function (ev, l) {
    if (this.checked) hiddenLooms.delete(l); else hiddenLooms.add(l);
    visibility();
  });
loomRows.append("span").attr("class", "swatch")
  .style("background", (l) => loomColor(l));
loomRows.append("span").text((l) => l);
// Row click highlights the loom; clicks on the checkbox itself only filter.
loomRows.on("click", (ev, l) => {
  if (ev.target && ev.target.tagName === "INPUT") return;
  activeLoom = activeLoom === l ? null : l;
  activeNode = null; activeEdge = null;
  highlight();
});
legend.append("div").attr("class", "hint")
  .html("checkbox: filter loom &middot; name: highlight loom<br>" +
        "click node / edge: highlight &middot; background: clear");
</script>
</body>
</html>
